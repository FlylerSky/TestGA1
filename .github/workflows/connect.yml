# .github/workflows/connect.yaml
#
# Workflow này cho phép bạn SSH vào Github Actions runner từ máy local.
#
# ─── Cách thiết lập ───────────────────────────────────────────────────────────
#
# 1. Cần một Relay Server (WebSocket) public. Lựa chọn nhanh nhất:
#    - Dùng relay/relay-server.js (tự host trên VPS) — xem README
#    - Hoặc dùng socketrelay.io / cloudflare tunnel để expose localhost
#
# 2. Thêm Secrets vào repo (Settings → Secrets → Actions):
#    - RELAY_URL   : wss://your-relay-server.com/session
#    - SSH_SECRET  : một chuỗi bí mật bất kỳ, đủ mạnh
#
# 3. Trigger workflow thủ công từ tab Actions → "SSH into Runner"
#
# 4. Chạy client trên máy bạn:
#    RELAY_URL=wss://... SSH_SECRET=... node client.js
#
# ─────────────────────────────────────────────────────────────────────────────

name: SSH into Runner

on:
  # Kích hoạt thủ công từ GitHub UI hoặc gh CLI
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Thời gian tối đa giữ session (phút)"
        required: false
        default: "60"

jobs:
  ssh-session:
    name: "🔌 Open SSH Tunnel"
    runs-on: ubuntu-latest

    # Giới hạn thời gian chạy tối đa
    timeout-minutes: ${{ fromJson(github.event.inputs.timeout_minutes || '60') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install WebSocket dependency
        run: npm install ws
        working-directory: ${{ github.workspace }}

      # Tuỳ chọn: cài thêm công cụ hữu ích trên runner
      - name: Install useful tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            curl wget jq tree htop net-tools iputils-ping \
            build-essential python3 python3-pip

      # In thông tin runner để bạn biết đang ở đâu
      - name: Print runner info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Runner   : $RUNNER_NAME"
          echo "  OS       : $(uname -a)"
          echo "  Workspace: $GITHUB_WORKSPACE"
          echo "  CPU      : $(nproc) cores"
          echo "  RAM      : $(free -h | awk '/^Mem:/{print $2}') total"
          echo "  Disk     : $(df -h / | awk 'NR==2{print $4}') free"
          echo "  Public IP: $(curl -sf https://ipinfo.io/ip)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # Bước chính: chạy server.js và giữ kết nối
      - name: Start SSH tunnel server
        env:
          RELAY_URL  : ${{ secrets.RELAY_URL }}
          SSH_SECRET : ${{ secrets.SSH_SECRET }}
          RUNNER_NAME: ${{ runner.name }}
        run: |
          echo "🚀 Đang khởi động SSH tunnel..."
          echo "   Chạy lệnh sau trên máy local của bạn:"
          echo ""
          echo "   RELAY_URL=$RELAY_URL \\"
          echo "   SSH_SECRET=<secret> \\"
          echo "   node client.js"
          echo ""
          node server.js
        # server.js sẽ chạy cho đến khi:
        # - Client ngắt kết nối
        # - Job timeout
        # - Bạn gõ `exit` trong shell

      - name: Session ended
        if: always()
        run: echo "✅ SSH session đã kết thúc."
