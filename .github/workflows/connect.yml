name: SSH into Runneron:workflow_dispatch:inputs:timeout_minutes:description: "Thời gian tối đa giữ session (phút)"required: falsedefault: "60"jobs:ssh-session:name: "🔌 Open SSH Tunnel"runs-on: ubuntu-latesttimeout-minutes: ${{ fromJson(github.event.inputs.timeout_minutes || '60') }}steps:
  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Install dependencies
    run: |
      sudo apt-get update -qq
      sudo apt-get install -y -qq build-essential python3
      npm install ws node-pty

  - name: Create runner-server.js
    run: |
      cat << 'EOF' > runner-server.js
      const WebSocket = require("ws");
      const pty = require("node-pty");
      const os = require("os");
      
      const ws = new WebSocket(process.env.RELAY_URL, { headers: { "x-secret": process.env.SSH_SECRET, "x-role": "server" } });
      let shellProcess;
      
      ws.on("open", () => {
        shellProcess = pty.spawn("bash", [], { name: "xterm-256color", cols: 80, rows: 24, cwd: process.env.GITHUB_WORKSPACE, env: process.env });
        shellProcess.onData((data) => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: "data", payload: Buffer.from(data).toString("base64") })); });
        shellProcess.onExit(() => process.exit(0));
      });
      
      ws.on("message", (raw) => {
        try {
          const msg = JSON.parse(raw.toString());
          if (msg.type === "data") shellProcess.write(Buffer.from(msg.payload, "base64").toString("utf-8"));
          else if (msg.type === "resize") shellProcess.resize(msg.cols, msg.rows);
        } catch (e) {}
      });
      
      ws.on("close", () => { if(shellProcess) shellProcess.kill(); process.exit(0); });
      EOF

  - name: Start SSH tunnel server
    env:
      RELAY_URL  : ${{ secrets.RELAY_URL }}
      SSH_SECRET : ${{ secrets.SSH_SECRET }}
    run: |
      echo "🚀 Đang khởi động SSH tunnel..."
      echo "Chạy lệnh sau trên máy tính của bạn:"
      echo "RELAY_URL=$RELAY_URL SSH_SECRET=*** node client.js"
      node runner-server.js
