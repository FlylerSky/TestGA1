name: SSH Debug via Cloudflare Quick Tunnel

on:
  workflow_dispatch:

jobs:
  ssh-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Giới hạn tối đa 6 tiếng của GitHub Actions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Cài đặt Cloudflared & OpenSSH Server
      - name: Install Cloudflared & SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # 2. Cấu hình SSH Public Key cho runner
      - name: Setup SSH Auth Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PUBLIC_KEY }}" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh
          sudo service ssh start

      # 3. Khởi chạy Cloudflare Quick Tunnel & Tự động lấy URL
      - name: Start Cloudflare Quick Tunnel
        run: |
          cloudflared tunnel --url ssh://localhost:22 > cloudflared.log 2>&1 &
          
          echo "Đang chờ Cloudflare cấp Quick Tunnel URL..."
          # Vòng lặp chờ tối đa 30s để bắt URL từ log
          for i in {1..15}; do
            URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' cloudflared.log | head -n 1)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          echo "========================================================="
          if [ -n "$URL" ]; then
            CLEAN_URL=$(echo "$URL" | sed 's|https://||')
            echo "LINK QUICK TUNNEL: $URL"
            echo ""
            echo "LỆNH SSH TRÊN MÁY LOCAL CỦA MÀY:"
            echo "ssh runner@$CLEAN_URL -o ProxyCommand=\"cloudflared access ssh --hostname %h\""
          else
            echo "LỖI: Không lấy được URL Quick Tunnel. Chi tiết log:"
            cat cloudflared.log
          fi
          echo "========================================================="

      # 4. Duy trì Job liên tục tối đa 6 tiếng (21600 giây)
      - name: Keep Alive (Max 6 Hours)
        run: |
          echo "Job đang chạy và duy trì tunnel trong 6 tiếng..."
          sleep 21600
