name: SSH into Runner

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: "Timeout session (phút)"
        required: false
        default: "60"

jobs:
  ssh-session:
    name: "🔌 Khởi chạy SSH Server"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(github.event.inputs.timeout_minutes || '60') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cài đặt thư viện WS và PTY
        run: npm install ws node-pty

      - name: Tạo file Server và Chạy
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          SSH_SECRET: ${{ secrets.SSH_SECRET }}
        run: |
          cat << 'EOF' > runner-server.js
          const os = require("os");
          const pty = require("node-pty");
          const WebSocket = require("ws");

          const RELAY_URL = process.env.RELAY_URL;
          const SECRET = process.env.SSH_SECRET;

          if (!RELAY_URL || !SECRET) {
            console.error("❌ Thiếu RELAY_URL hoặc SSH_SECRET");
            process.exit(1);
          }

          console.log(`🔌 Đang kết nối tới Relay: ${RELAY_URL}`);
          const ws = new WebSocket(RELAY_URL, {
            headers: { "x-secret": SECRET, "x-role": "server" },
          });

          let shell;

          ws.on("open", () => {
            console.log("✅ Đã kết nối với Relay! Đang chờ Client...");
          });

          ws.on("message", (raw) => {
            try {
              const msg = JSON.parse(raw.toString());
              
              if (msg.type === "resize" && shell) {
                shell.resize(msg.cols, msg.rows);
              } 
              else if (msg.type === "data" && shell) {
                shell.write(Buffer.from(msg.payload, "base64").toString("utf-8"));
              }
              else if (msg.type === "ping") {
                ws.send(JSON.stringify({ type: "pong" }));
              }
            } catch (e) {
              if (!shell) {
                shell = pty.spawn("bash", [], {
                  name: "xterm-color",
                  cols: 80,
                  rows: 30,
                  cwd: process.env.GITHUB_WORKSPACE || process.cwd(),
                  env: process.env
                });

                shell.onData((data) => {
                  if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                      type: "data",
                      payload: Buffer.from(data).toString("base64")
                    }));
                  }
                });
                
                shell.write(raw.toString());
              } else {
                shell.write(raw.toString());
              }
            }
          });

          ws.on("close", () => {
            console.log("🔌 Đóng kết nối. Dừng server...");
            if (shell) shell.kill();
            process.exit(0);
          });
          EOF

          node runner-server.js
